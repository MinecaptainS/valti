name: Verify VALTI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
      - name: Verify data and scoring
        run: node --test tests/scoring.test.cjs
      - name: Report reproducible distribution
        run: node tests/distribution.cjs
